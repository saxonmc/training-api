[project]
name = "training-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saxonmc", email = "saxon@erabond.io" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
training-api = "training_api:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
